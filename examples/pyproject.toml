[project]
name = "tapio-examples"
version = "0.0.0"
description = "Runnable, asserted examples for tapio: dev-only, never shipped in the wheel."
requires-python = ">=3.11"
dependencies = ["tapio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tapio_examples"]

[tool.uv.sources]
tapio = { workspace = true }
