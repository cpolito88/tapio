default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff and mypy run out of the project's own environment rather than from a
  # hook that pins its own copy. A second pin drifts: the ruff hook here was
  # eleven minor releases behind the ruff `uv.lock` resolves, so a commit the
  # hook accepted could still fail `make lint`, and the two formatters rewrote
  # each other's output. `uv run` resolves the same tool the Makefile does, so
  # there is one ruff and one mypy over this repository.
  #
  # `--force-exclude` is what the published ruff hooks pass, and it is needed
  # for the same reason: pre-commit names the staged files on the command
  # line, and ruff applies `extend-exclude` to a file named that way only
  # when asked to. Without it the hook formats `tests/docs/`, which
  # `make lint` leaves alone.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict src/tapio examples/tapio_examples
        language: system
        pass_filenames: false
        types: [python]
