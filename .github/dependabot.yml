# Keeps the actions in `.github/workflows/` and the pins in `uv.lock` current.
# Without this they go stale quietly: every action in the pipeline had drifted
# between one and five majors behind before this file existed, and the first
# sign of it was a deprecation warning about the Node version the runner was
# forcing.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `ci:` so the bump does not move the version. python-semantic-release
      # reads these on main, and an action upgrade releases nothing.
      prefix: "ci"
    groups:
      # One pull request for the routine bumps, since they are reviewed
      # together and each one on its own is noise. A major still arrives
      # separately, because that is the one worth reading.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The lock that decides what users install. A bot editing it was held back as
  # a separate decision, and the answer is that nothing here merges itself:
  # `make ci` runs on every pull request across all four Python versions, so a
  # bump that breaks anything is red before a human reads it. `make lock` is
  # still how a human re-resolves everything on purpose. This only stops the
  # lock going stale in the gaps between those moments.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `build:` so the bump does not move the version either. It is the
      # conventional-commits type for a dependency change, and it is in the
      # set python-semantic-release recognises without being in the set that
      # releases anything.
      prefix: "build"
    groups:
      # Grouped for the same reason as the actions above.
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
