name: Audit

# A CVE can be published against a version that is already locked, with no
# commit to the repository. `make ci` runs the same scan on every push and
# pull request, but it would not see that advisory until the next one. This
# runs the scan on a schedule, and reports in an issue rather than in a red
# run that nobody is watching.
on:
  schedule:
    # Daily, at an odd minute: most scheduled workflows start on the hour, and
    # GitHub delays those under load.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # One issue at a time, found again by its title, so a finding that
      # persists for a week adds comments to one issue instead of opening
      # seven.
      TITLE: "Scheduled dependency audit failed"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: make audit
        id: audit
        run: |
          # The exit status is kept rather than failing the step here, so the
          # report below can quote the output. The last step fails the run.
          set +e
          make audit 2>&1 | tee audit.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # A failure is reported whatever its cause. A new advisory is the usual
      # one, but an unreachable advisory database also means nothing was
      # checked today, and that is worth knowing too.
      - name: Report a failure
        if: steps.audit.outputs.status != '0'
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The scheduled \`make audit\` failed on \`$GITHUB_REF_NAME\` at $(git rev-parse --short HEAD). [Run log]($run_url)."
            echo
            echo "CONTRIBUTING.md says what to do when the scan fails."
            echo
            echo '```'
            # An issue body is capped at 65536 characters.
            tail -c 60000 audit.txt
            echo '```'
          } > report.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Close the report once the scan passes
        if: steps.audit.outputs.status == '0'
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The scheduled \`make audit\` passed on \`$GITHUB_REF_NAME\` at $(git rev-parse --short HEAD)."
          fi

      - name: Fail the run
        if: steps.audit.outputs.status != '0'
        run: exit 1
