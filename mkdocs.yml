site_name: tapio
site_description: A Pekko-inspired actor toolkit for Python.
site_url: https://cpolito88.github.io/tapio/
repo_url: https://github.com/cpolito88/tapio
repo_name: cpolito88/tapio

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # Docs never copy-paste code: every block is a snippet include from examples/.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Playground: playground/index.md
  - The life of an actor: lifecycle.md
  - Supervision: supervision.md
  - Blocking calls: blocking.md
  - Testing: testing.md
  - Remoting:
      - Overview: remoting.md
      - When a node stops answering: unreachable.md
      - Security: security.md
  - Clustering: clustering.md
  - Reference: reference.md
